name: Origin Bio
description: >-
  Origin Bio is a cancer-biology research company that generates spatial,
  molecular, and functional maps from patient tumor samples to study cancer in
  its native tissue context. Its platform combines a spatial genomics pipeline
  that maps gene expression while preserving tissue architecture, tissue
  phenotyping that grounds molecular findings in histology and protein
  measurements, and functional response testing that runs ex vivo drug and
  perturbation experiments on precision-cut tumor slices. On top of this
  proprietary sequencing and spatial-transcriptomics data the company trains
  multimodal AI models for therapeutic target discovery, treatment-response
  prediction, and patient stratification. Origin Bio is a Y Combinator
  (Winter 2026) company. As of this profile the company publishes no
  public-facing API, developer documentation, or SDKs; this record is
  maintained in the API Evangelist network as a company profile.
